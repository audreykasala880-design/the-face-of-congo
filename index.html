<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Formulaire de Candidature - The Face of Congo</title>
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <script src="/pwa.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body>
<main class="container">
    <header>
        <img class="brand-logo" src="/logo.svg" alt="Logo The Face of Congo">
        <p class="brand-eyebrow">Kazert Évent présente</p>
        <h1 class="brand-title">THE FACE OF CONGO</h1>
        <p>Formulaire de Candidature au Concours</p>
    </header>

    <p id="form-message" class="notice" role="status" hidden></p>
    <form id="application-form" action="/api/applications" method="POST" enctype="multipart/form-data">
        <fieldset>
            <legend>1. Informations Personnelles</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" maxlength="120" required>
                </div>
                <div class="form-group">
                    <label for="postnom">Postnom :</label>
                    <input type="text" id="postnom" name="postnom" maxlength="120">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" maxlength="120" required>
                </div>
                <div class="form-group">
                    <label>Sexe :</label>
                    <div class="radio-group">
                        <label><input type="radio" name="sexe" value="Femme" required> Femme</label>
                        <label><input type="radio" name="sexe" value="Homme" required> Homme</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="telephone">Téléphone / WhatsApp :</label>
                <input type="tel" id="telephone" name="telephone" placeholder="+243..." maxlength="40" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Informations sur le Candidat</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="nom_scene">Nom de scène ou pseudonyme :</label>
                    <input type="text" id="nom_scene" name="nom_scene" maxlength="120">
                </div>
                <div class="form-group">
                    <label for="date_naissance">Date de naissance :</label>
                    <input type="date" id="date_naissance" name="date_naissance" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="ville">Ville de résidence :</label>
                    <input type="text" id="ville" name="ville" value="Kinshasa" maxlength="120" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" maxlength="254" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="taille">Taille (en cm) :</label>
                    <input type="number" id="taille" name="taille" min="100" max="250" placeholder="ex: 175" required>
                </div>
                <div class="form-group">
                    <label for="profession">Profession / Activité :</label>
                    <input type="text" id="profession" name="profession" maxlength="160">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Expérience en mannequinat :</label>
                    <div class="radio-group">
                        <label><input type="radio" name="experience" value="Oui"> Oui</label>
                        <label><input type="radio" name="experience" value="Non" checked> Non</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Type de modèle :</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="type_modele" value="Mode"> Mode</label>
                        <label><input type="checkbox" name="type_modele" value="Beaute"> Beauté</label>
                        <label><input type="checkbox" name="type_modele" value="Commercial"> Commercial</label>
                        <label><input type="checkbox" name="type_modele" value="Artistique"> Artistique</label>
                    </div>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. Participation au Concours</legend>
            <div class="form-group full-width">
                <label for="motivation">Pourquoi souhaitez-vous participer ?</label>
                <textarea id="motivation" name="motivation" maxlength="5000" required></textarea>
            </div>
            <div class="form-group full-width">
                <label for="qualites">Votre motivation et vos qualités :</label>
                <textarea id="qualites" name="qualites" maxlength="5000" required></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>4. Photos à Fournir</legend>
            <div class="form-group">
                <label for="photo_portrait">Une photo portrait du visage (JPG, PNG ou WEBP, 2 Mo max) :</label>
                <input type="file" id="photo_portrait" name="photo_portrait" accept="image/jpeg,image/png,image/webp" required class="file-upload">
            </div>
            <div class="form-group">
                <label for="photo_pied">Une photo en pied (JPG, PNG ou WEBP, 2 Mo max) :</label>
                <input type="file" id="photo_pied" name="photo_pied" accept="image/jpeg,image/png,image/webp" required class="file-upload">
            </div>
            <div class="form-group">
                <label for="photo_artistique">Une photo artistique ou professionnelle (facultative, 2 Mo max) :</label>
                <input type="file" id="photo_artistique" name="photo_artistique" accept="image/jpeg,image/png,image/webp" class="file-upload">
            </div>
        </fieldset>

        <fieldset>
            <legend>5. Engagement du Candidat</legend>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="engagement" value="1" required>
                    Je certifie que les informations fournies sont exactes et j'accepte le règlement officiel de la compétition.
                </label>
            </div>
            <div class="form-row spaced-row">
                <div class="form-group">
                    <label for="signature">Signature du candidat (Nom complet) :</label>
                    <input type="text" id="signature" name="signature" maxlength="240" placeholder="Votre nom en guise de signature" required>
                </div>
                <div class="form-group">
                    <label for="date_soumission">Date :</label>
                    <input type="date" id="date_soumission" name="date_soumission" required>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="submit-btn">Soumettre ma candidature</button>
    </form>
    <footer class="form-footer">
        <button class="install-button" type="button" data-install-app hidden>Installer l’application</button>
        <a href="/admin">Administration</a>
    </footer>
</main>
</body>
</html>
